project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"

lang: sv

website:
  title: "STK120 Regressionsanalys: mentorspass"
  page-footer: "STK120 · Handelshögskolan vid Göteborgs universitet · Mentorsmaterial HT26"
  page-navigation: true
  navbar:
    left:
      - text: "Start"
        href: index.qmd
      - text: "Om materialet"
        href: om.qmd
      - text: "Alla verktyg"
        href: "https://johlobs.github.io/"
        target: "_blank"
  sidebar:
    style: "docked"
    search: true
    contents:
      - text: "Start"
        href: index.qmd
      - section: "Mentorspass HT26"
        contents:
          - pass1.qmd
          - pass2.qmd
          - pass3.qmd
          - pass4.qmd
          - pass5.qmd
      - section: "Referens"
        contents:
          - om.qmd

format:
  html:
    theme: flatly
    css: custom.css
    toc: true
    toc-depth: 2
    toc-title: "På sidan"
    number-sections: false
